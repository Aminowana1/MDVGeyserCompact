# ==========================================================
# MDVGeyserCompat 1.0.1
# Geyser Extension para MDVCRAFT
# ==========================================================
#
# IMPORTANTE:
# - Es una EXTENSION de Geyser, no un plugin Bukkit normal.
# - El .jar va en plugins/Geyser-Spigot/extensions/
# - Requiere Geyser 2.11.x y enable-custom-content: true.
# - Los registros de items/skulls se crean al iniciar Geyser.
#   Despues de cambios, reinicia el servidor completo.
#

item-models:
  enabled: true

  # Registra TODOS los item_model vanilla como apariencia para estos
  # materiales base. STICK es el caso principal de MDVCRAFT.
  #
  # Ejemplos:
  # /give @s stick[minecraft:item_model="minecraft:diamond_pickaxe"]
  # /give @s stick[minecraft:item_model="minecraft:chorus_fruit"]
  #
  # Puedes agregar otras bases si las usas, por ejemplo minecraft:apple.
  # NO pongas todos los materiales aqui: cada base multiplica la cantidad
  # de definiciones registradas en Bedrock.
  base-items:
    - minecraft:stick
    - minecraft:apple

  # Incluye materiales que tambien son bloques.
  include-block-items: true

  # Conserva la representacion 3D previa para targets que son bloques.
  # Desde 1.0.1 SIEMPRE se genera ademas un icono 2D para inventarios/menus,
  # por lo que ya no deberian aparecer sin textura en una GUI.
  use-3d-block-icons: true

  # Overrides manuales para excepciones Java -> textura vanilla Bedrock.
  # Formato: minecraft:item=bedrock_texture_path
  # No pongas .png al final.
  texture-overrides: []
  # - minecraft:mi_item=textures/items/ruta_real
  # - minecraft:mi_bloque=textures/blocks/ruta_real

  # Overrides cuando el ID de bloque Java y Bedrock no coincidan.
  # Solo afecta al componente 3D de bloques.
  # Formato: minecraft:java_block=minecraft:bedrock_block
  block-id-overrides: []

skulls:
  enabled: true

  # Cachea los perfiles encontrados. Con esto NO vuelve a revisar cientos
  # de jars/configs en cada reinicio.
  cache-enabled: true

  # Ponlo true SOLO para un reinicio cuando agregues muchas cabezas nuevas.
  # Luego vuelvelo a false.
  rebuild-cache: false

  # Busca automaticamente Base64 de texturas de cabezas en configs/plugins.
  scan-server-files: true

  # Rutas relativas a la raiz del servidor.
  scan-roots:
    - plugins

  # Archivos de texto/config que se revisan.
  text-extensions:
    - yml
    - yaml
    - json
    - txt
    - conf
    - properties

  # Tambien busca strings Base64 incrustados dentro de .jar/.class.
  # Solo se hace al construir/reconstruir la cache.
  scan-jars: true

  # Limites de seguridad para no leer archivos gigantes accidentalmente.
  max-file-size-mb: 16
  max-jar-entry-mb: 4

  # Puedes registrar una textura manualmente si no fue detectada.
  manual-profiles: []
  # - eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvLi4uIn19fQ==

debug: false
