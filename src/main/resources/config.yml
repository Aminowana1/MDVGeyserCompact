# ==========================================================
# MDVGeyserCompat 1.0.7
# Geyser Extension para MDVCRAFT
# ==========================================================
#
# IMPORTANTE:
# - Es una EXTENSION de Geyser, no un plugin Bukkit normal.
# - El .jar va en plugins/Geyser-Spigot/extensions/
# - Requiere Geyser 2.11.x y enable-custom-content: true.
# - Los registros de items/skulls se crean al iniciar Geyser.
#   Despues de cambios, reinicia el servidor completo.
#

item-models:
  enabled: true

  # MDVCRAFT: todos los item_model reales viven en plugins/MMOItems/item.
  # Este modo registra SOLO los pares material+model que encuentre en esos YAML.
  #
  # IMPORTANTE:
  # Antes STICK/APPLE se registraban contra ~1400 modelos cada uno. Eso generaba
  # miles de definiciones y Geyser terminaba omitiendo muchas. En 1.0.5 este
  # modo exacto evita ese problema y tambien reduce el tiempo/pack generado.
  mmoitems-only-mode: true
  mmoitems-folder: plugins/MMOItems/item

  # Solo se usan si mmoitems-only-mode=false.
  base-items: []

  auto-detect-pairs: true

  # Solo se usan si mmoitems-only-mode=false.
  pair-scan-roots:
    - plugins/MMOItems/item

  pair-scan-extensions:
    - yml
    - yaml

  pair-scan-max-file-size-mb: 16

  # Para una combinacion creada por codigo y que NO exista en MMOItems/item.
  # Formato BASE=>MODELO.
  manual-pairs: []
  # - minecraft:paper=>minecraft:tripwire_hook

  include-block-items: true

  # Compatibilidad heredada. Se conserva por compatibilidad con configs viejas.
  use-3d-block-icons: false

  # IMPORTANTE 1.0.7:
  # Geyser 2.11.x NO permite el componente Geyser BLOCK_PLACER en custom items
  # que extienden un item vanilla (STICK, PAPER, STONE_PICKAXE, etc.).
  # Si se intenta, Geyser lanza: "That component cannot be used for vanilla items".
  # Por eso esta opcion queda solo por compatibilidad con configs viejas y se ignora.
  # Los bloques usan un fallback visual 2D/carry estable para que SI se vean.
  native-block-rendering: false

  # Overrides manuales Java item_model -> textura vanilla Bedrock.
  texture-overrides: []
  # - minecraft:lightning_rod=textures/blocks/lightning_rod

  # Overrides cuando el ID de bloque Java y Bedrock no coincidan.
  block-id-overrides: []

skulls:
  enabled: true

  # Cachea los perfiles encontrados. No vuelve a revisar cientos de jars/configs
  # en cada reinicio.
  cache-enabled: true

  # Ponlo true SOLO para un reinicio cuando agregues muchas cabezas nuevas.
  # Luego vuelvelo a false.
  rebuild-cache: false

  scan-server-files: true

  scan-roots:
    - plugins

  text-extensions:
    - yml
    - yaml
    - json
    - txt
    - conf
    - properties

  # Solo se hace al construir/reconstruir la cache.
  scan-jars: true

  max-file-size-mb: 16
  max-jar-entry-mb: 4

  manual-profiles: []

debug: false
