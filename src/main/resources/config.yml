# ==========================================================
# MDVGeyserCompat 1.0.2
# Geyser Extension para MDVCRAFT
# ==========================================================
#
# IMPORTANTE:
# - Es una EXTENSION de Geyser, no un plugin Bukkit normal.
# - El .jar va en plugins/Geyser-Spigot/extensions/
# - Requiere Geyser 2.11.x y enable-custom-content: true.
# - Los registros de items/skulls se crean al iniciar Geyser.
#   Despues de cambios, reinicia el servidor completo.
#

item-models:
  enabled: true

  # Bases "amplias": estas pueden verse como CUALQUIER item/bloque vanilla.
  # STICK es la base principal de MDVCRAFT; APPLE queda por compat/pruebas.
  #
  # NO pongas todos los materiales aqui: cada base amplia registra ~1400
  # definiciones. Para TRIDENT, STONE_PICKAXE, PAPER, comida, etc. la 1.0.2
  # detecta automaticamente solo los pares que realmente usas en configs.
  base-items:
    - minecraft:stick
    - minecraft:apple

  # Detecta material + model/item_model en YAML/JSON/TXT del servidor.
  # Ejemplos que ya no necesitan ir en base-items:
  #   material: TRIDENT       + model: diamond_axe
  #   material: STONE_PICKAXE + model: bamboo
  #   material: PAPER         + model: tripwire_hook
  auto-detect-pairs: true

  pair-scan-roots:
    - plugins

  pair-scan-extensions:
    - yml
    - yaml
    - json
    - txt
    - conf
    - properties

  pair-scan-max-file-size-mb: 16

  # Para una combinacion creada por codigo y no visible en configs, agregala aca.
  # Formato BASE=>MODELO. Solo registra ese par, no 1400 modelos.
  manual-pairs: []
  # - minecraft:stone_pickaxe=>minecraft:feather
  # - minecraft:paper=>minecraft:tripwire_hook
  # - minecraft:salmon=>minecraft:golden_apple

  # Incluye materiales que tambien son bloques.
  include-block-items: true

  # Solo los bloques SOLIDOS usan el render 3D de bloque Bedrock.
  # Plantas/flores/bambu/tripwire/etc. usan icono plano/carry para evitar
  # missing textures y modelos equivocados, sobre todo en menus.
  use-3d-block-icons: true

  # Overrides manuales Java -> textura vanilla Bedrock.
  # Formato: minecraft:item=bedrock_texture_path (sin .png)
  texture-overrides: []
  # - minecraft:mi_item=textures/items/ruta_real
  # - minecraft:mi_bloque=textures/blocks/ruta_real

  # Overrides cuando el ID de bloque Java y Bedrock no coincidan.
  # Solo afecta al componente 3D de bloques SOLIDOS.
  block-id-overrides: []

skulls:
  enabled: true

  # Cachea los perfiles encontrados. No vuelve a revisar cientos de jars/configs
  # en cada reinicio.
  cache-enabled: true

  # Ponlo true SOLO para un reinicio cuando agregues muchas cabezas nuevas.
  # Luego vuelvelo a false.
  rebuild-cache: false

  scan-server-files: true

  scan-roots:
    - plugins

  text-extensions:
    - yml
    - yaml
    - json
    - txt
    - conf
    - properties

  # Solo se hace al construir/reconstruir la cache.
  scan-jars: true

  max-file-size-mb: 16
  max-jar-entry-mb: 4

  manual-profiles: []

debug: false
